name: ❓ Question / Support
description: Ask a "how do I...?" question or get help using the SDK
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a usage question rather than a bug report? You're in the right place.
        Tip: check the [docs](https://github.com/Kotak-Neo/kotak-neo-python/tree/main/docs) first — your answer might already be there.

  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried so far?
      description: Relevant code, docs you've already checked, etc.
      render: python
    validations:
      required: false

  - type: textarea
    id: log-file
    attributes:
      label: Log file (optional)
      description: |
        If your question is about unexpected SDK behavior, drag and drop your
        `logs/neo-api-client.log` file here (or paste its relevant lines) — see the
        [Logging Guide](https://github.com/Kotak-Neo/kotak-neo-python/blob/main/docs/guides/logging.md#troubleshooting-an-issue-share-the-log-file)
        for how to enable it. Sensitive fields are already masked, so it's safe to share as-is.
        **Only `.log` files are accepted** — please don't attach other file formats.
    validations:
      required: false

  - type: dropdown
    id: sdk-version
    attributes:
      label: SDK version
      description: Check with `pip show kotakneoapi` if you're not sure.
      options:
        - "3.0.1"
        - "3.0.0"
    validations:
      required: false
