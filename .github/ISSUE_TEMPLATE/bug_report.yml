name: 🐛 Bug Report
description: Something in the SDK isn't working as expected (unexpected error, wrong response, crash, etc.)
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Please fill in as much detail as you can —
        it helps us reproduce and fix the issue faster.

  - type: dropdown
    id: sdk-version
    attributes:
      label: SDK version
      description: Check with `pip show kotakneoapi` if you're not sure.
      options:
        - "3.0.3"
        - "3.0.2"
        - "3.0.1"
        - "3.0.0"
    validations:
      required: true

  - type: dropdown
    id: python-version
    attributes:
      label: Python version
      description: The SDK supports Python 3.10–3.14. If you're on a different version, please upgrade before reporting.
      options:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Prod
        - UAT
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: false

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet or step-by-step sequence that triggers the issue.
    validations:
      required: true

  - type: textarea
    id: error-payload
    attributes:
      label: Error response / traceback
      description: |
        Paste the exact error you received — the raw API response (e.g. `{"stCode": ..., "errMsg": ..., "stat": ...}`)
        and/or the Python traceback. This is usually the single most useful piece of information for triage.
      render: json
    validations:
      required: false

  - type: textarea
    id: log-file
    attributes:
      label: Log file (optional, but very helpful)
      description: |
        If you can enable file logging and reproduce the issue, drag and drop the resulting
        `logs/neo-api-client.log` file here (or paste its relevant lines) — see the
        [Logging Guide](https://github.com/Kotak-Neo/kotak-neo-python/blob/main/docs/guides/logging.md#troubleshooting-an-issue-share-the-log-file)
        for how to enable it. Sensitive fields are already masked, so it's safe to share as-is.
        **Only `.log` files are accepted** — please don't attach other file formats.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that might be relevant (network, timing, frequency, related API calls before this one, etc.)
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this hasn't already been reported.
          required: true
        - label: I'm using a supported Python version (3.10+) and a recent SDK release.
          required: false
