name: Test Kotak Neo SDK

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade Packaging Tools
        run: |
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel \
            build

      - name: Install SDK and Development Dependencies
        run: |
          pip install -e ".[dev]"

      - name: Verify Editable Installation
        run: |
          python - <<'EOF'
          import neo_api_client
          from neo_api_client import NeoAPI

          print("SDK import successful")
          print("Package location:", neo_api_client.__file__)
          EOF

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Run Ruff Format Check
        run: |
          ruff format --check .

      - name: Run Unit Tests
        run: |
          python -m pytest tests -v

      - name: Build Source and Wheel Distribution
        run: |
          python -m build

      - name: Verify Built Artifacts
        run: |
          ls -lah dist/

      - name: Verify Wheel Installation
        run: |
          pip uninstall -y neo-api-client || true
          pip install --force-reinstall dist/*.whl

          python - <<'EOF'
          from neo_api_client import NeoAPI

          print("Wheel installation successful")
          EOF

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-py${{ matrix.python-version }}
          path: dist/

  security:
    name: Security Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install SDK (runtime deps only) and Security Tools
        # Install only the SDK's runtime dependencies plus the two scanners, so
        # the CVE audit reflects what ships to users — not dev-only tooling
        # (e.g. safety pulls in nltk, whose CVEs are irrelevant to this SDK).
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install bandit[toml] pip-audit

      - name: Bandit (static analysis of SDK source)
        run: |
          bandit -c pyproject.toml -r neo_api_client/

      - name: pip-audit (dependency CVE scan)
        # Audit the SDK's installed runtime dependencies for known
        # vulnerabilities. Skip the local editable package itself (not on PyPI).
        run: |
          pip-audit --skip-editable

  checkmarx:
    name: Checkmarx One Scan
    runs-on: ubuntu-24.04
    # Only run when the Checkmarx credentials are configured (skips on forks/PRs
    # from contributors without access to the org secrets).
    if: ${{ github.event_name == 'push' || github.repository == 'Kotak-Neo/kotak-neo-python' }}

    steps:
      - name: Checkout Repository
        # full history so Checkmarx can attribute findings to commits
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkmarx One (SAST + SCA + secret detection)
        uses: checkmarx/ast-github-action@main
        with:
          base_uri: ${{ secrets.CX_BASE_URI }}
          cx_tenant: ${{ secrets.CX_TENANT }}
          cx_client_id: ${{ secrets.CX_CLIENT_ID }}
          cx_client_secret: ${{ secrets.CX_CLIENT_SECRET }}
          # Scan the SDK source; exclude built artifacts, the large scrip-master
          # CSV data files (not code), tests, and caches to reduce noise.
          additional_params: >-
            --scan-types sast,sca,secret-detection
            --project-name kotak-neo-python
            --branch ${{ github.ref_name }}
            --file-filter "!**/dist/**,!**/*.csv,!**/__pycache__/**,!**/*.egg-info/**"
