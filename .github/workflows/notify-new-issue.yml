name: Notify on New Issue

on:
  issues:
    types: [opened, reopened]

jobs:
  notify-teams:
    name: Post to MS Teams
    runs-on: ubuntu-24.04

    steps:
      - name: Check Teams webhook configured
        id: check
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          if [ -n "$TEAMS_WEBHOOK_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Teams notification
        # Skip silently if the webhook secret isn't configured yet, rather than
        # failing the run — lets this workflow be merged before the secret exists.
        if: steps.check.outputs.configured == 'true'
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO_NAME: ${{ github.repository }}
        run: |
          # Build the Teams "MessageCard" payload with jq so special
          # characters (quotes, newlines) in the issue title/body are
          # escaped correctly rather than breaking the JSON.
          #
          # GitHub issue-form fields with `render:` set (code-block fields)
          # emit an empty fenced code block when left blank, instead of
          # "_No response_" like plain fields. Teams' MessageCard renderer
          # shows that empty fence as a code block with a visible line-number
          # gutter, i.e. a lone "1" — collapse it back to "_No response_".
          NORMALIZED_BODY=$(echo "$ISSUE_BODY" | perl -0777 -pe 's/```\w*\n\s*```/_No response_/g')
          BODY_PREVIEW=$(echo "$NORMALIZED_BODY" | head -c 500)
          PAYLOAD=$(jq -n \
            --arg title "New issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
            --arg repo "$REPO_NAME" \
            --arg author "$ISSUE_AUTHOR" \
            --arg url "$ISSUE_URL" \
            --arg preview "$BODY_PREVIEW" \
            '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "summary": $title,
              "themeColor": "0078D7",
              "title": $title,
              "sections": [
                {
                  "facts": [
                    { "name": "Repository", "value": $repo },
                    { "name": "Opened by", "value": $author }
                  ],
                  "text": $preview
                }
              ],
              "potentialAction": [
                {
                  "@type": "OpenUri",
                  "name": "View Issue",
                  "targets": [ { "os": "default", "uri": $url } ]
                }
              ]
            }')

          curl -sf -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$TEAMS_WEBHOOK_URL"
